thorMore":true,"abstract":"Abstract Inducible nucleosome remodeling at hundreds of latent enhancers and several promoters shapes the transcriptional response to Toll-like receptor 4 (TLR4) signaling in macrophages. We aimed to define the identities of the transcription factors that promote TLR-induced remodeling. An analysis strategy based on ATAC-seq and single-cell ATAC-seq that enriched for genomic regions most likely to undergo remodeling revealed that the transcription factor nuclear factor κB (NF-κB) bound to all high-confidence peaks marking remodeling during the primary response to the TLR4 ligand, lipid A. Deletion of NF-κB subunits RelA and c-Rel resulted in the loss of remodeling at high-confidence ATAC-seq peaks, and CRISPR-Cas9 mutagenesis of NF-κB-binding motifs …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2023-2026三年回溯","tkey":"other","id":144},{"title":"TEAD Inhibition Overcomes YAP1/TAZ-Driven Primary and Acquired Resistance to KRASG12C Inhibitors","url":"https://doi.org/10.1158/0008-5472.can-23-2994","doi":"10.1158/0008-5472.can-23-2994","journal":"Cancer Research","jabbr":"Cancer Research","pubdate":"2023-11-07","topic":"肿瘤免疫","topics":["肿瘤免疫","抗肿瘤药物"],"matchTerm":"antitumor","matchWhere":"摘要：antitumor、摘要：antitumor","score":6,"authors":["A. Cole Edwards","Clint A. Stalnecker","Alexis Jean Morales","Khalilah E. Taylor","Jennifer E. Klomp","Jeffrey A. Klomp"],"authorMore":true,"abstract":"Abstract Primary/intrinsic and treatment-induced acquired resistance limit the initial response rate to and long-term efficacy of direct inhibitors of the KRASG12C mutant in cancer. To identify potential mechanisms of resistance, we applied a CRISPR/Cas9 loss-of-function screen and observed loss of multiple components of the Hippo tumor suppressor pathway, which acts to suppress YAP1/TAZ-regulated gene transcription. YAP1/TAZ activation impaired the antiproliferative and proapoptotic effects of KRASG12C inhibitor (G12Ci) treatment in KRASG12C-mutant cancer cell lines. Conversely, genetic suppression of YAP1/WWTR1 (TAZ) enhanced G12Ci sensitivity. YAP1/TAZ activity overcame KRAS dependency through two distinct TEAD transcription factor-dependent mecha …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2023-2026三年回溯","tkey":"other","id":145},{"title":"Prebuilt Receptor Library Speeds Personalized T-Cell Therapy","url":"https://doi.org/10.1158/2159-8290.cd-nw2026-0104","doi":"10.1158/2159-8290.cd-nw2026-0104","journal":"Cancer Discovery","jabbr":"Cancer Discovery","pubdate":"2026-11-10","topic":"DNA损伤修复","topics":["DNA损伤修复"],"matchTerm":"tp53","matchWhere":"摘要：tp53","score":3,"authors":[],"authorMore":false,"abstract":"Abstract Using a library of ready-made T-cell receptors targeting recurring mutations in TP53, clinicians have developed a personalized autologous T-cell therapy that skips the usual months of bespoke receptor hunting and has produced responses lasting 6 to 19 months in early clinical testing.","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":146},{"title":"Prevalence and Actionability of MTAP Loss in Driver Oncogene-Positive and Oncogene-Negative Lung Cancer","url":"https://doi.org/10.1158/1078-0432.ccr-26-2695","doi":"10.1158/1078-0432.ccr-26-2695","journal":"Clinical Cancer Research","jabbr":"Clinical Cancer Research","pubdate":"2026-11-10","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"kinase inhibitors","matchWhere":"摘要：kinase inhibitors","score":3,"authors":["Takashi Sakai","Zofia Piotrowska","Charlotte I. Wang","Beow Y. Yeap","Mark Sabbagh","Rebecca S. Heist"],"authorMore":true,"abstract":"Abstract Purpose: MTAP loss co-occurs with actionable genomic alterations in NSCLC and creates vulnerability to protein arginine methyltransferase 5 (PRMT5) inhibition. Estimates of prevalence of MTAP loss rely on next-generation sequencing which can underestimate copy losses. Moreover, the activity of PRMT5 inhibitors in oncogene-driven NSCLC is not well established. Experimental Design: We assessed MTAP expression by immunohistochemistry (IHC) in 243 NSCLCs (n=132 early stage, n=111 metastatic), including 33 specimens with paired lymph nodes. Activity of PRMT5 inhibitor monotherapy and in combination with tyrosine kinase inhibitors (TKIs) was evaluated in MTAP-deleted NSCLC cell lines …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":147},{"title":"Lactate and lactylation in cancer: mechanistic insights and therapeutic implications","url":"https://doi.org/10.1186/s12943-026-02828-x","doi":"10.1186/s12943-026-02828-x","journal":"Molecular Cancer","jabbr":"Molecular Cancer","pubdate":"2026-11-09","topic":"肿瘤免疫","topics":["肿瘤免疫"],"matchTerm":"tumor microenvironment","matchWhere":"摘要：tumor microenvironment","score":3,"authors":["Ting Liu","Chen Huang","Chenliang Zhang","Yuyuan Xiong","Xudong Wang","丁震宇"],"authorMore":false,"abstract":"Metabolic reprogramming is a central hallmark of cancer and involves extensive alterations in nutrient utilization, glycolytic flux, and metabolite homeostasis. Among these metabolic changes, enhanced lactate production and accumulation within the tumor microenvironment have emerged as important regulators of tumor biology. Lactate was previously regarded as a metabolic waste product. However, increasing evidence indicates that lactate functions as a bioactive metabolite through distinct mechanisms, including extracellular acidification, lactate-mediated signaling, and regulation of lysine lactylation. Lysine lactylation is a recently identified metabolite-derived post-translational …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":148},{"title":"Detection, Monitoring, and Discrimination of Amyloidogenic vs Innocent Light Chains in Systemic Amyloidoses","url":"https://doi.org/10.1182/blood.2026034465","doi":"10.1182/blood.2026034465","journal":"Blood","jabbr":"Blood","pubdate":"2026-11-09","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"treatment response","matchWhere":"摘要：treatment response","score":3,"authors":["Giovanni Palladini","Paolo Milani","Mario Nuvolone"],"authorMore":false,"abstract":"Immunoglobulin light chains (LCs) span the spectrum of B-cell clonal disorders from monoclonal gammopathy of undetermined significance to multiple myeloma and Waldenström macroglobulinemia. Beyond serving as disease markers, monoclonal immunoglobulins can cause organ damage in monoclonal gammopathies of clinical significance (MGCS). In AL amyloidosis the pathogenic agent is a monoclonal light chain (LC). AL amyloidosis is a treatable yet rapidly progressive condition in which early diagnosis is critical for organ preservation and survival. High-sensitivity laboratory tools for detection of amyloidogenic LCs are essential in diagnosis, while precise quantitative methods are required for …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-10","tkey":"other","id":149},{"title":"Mechanosensitive YAP–RUNX1 signaling drives T H 1 cell dysfunction and tumor immunosuppression","url":"https://www.nature.com/articles/s41590-026-02708-y","doi":"10.1038/s41590-026-02708-y","journal":"Nature Immunology","jabbr":"Nature Immunology","pubdate":"2026-11-09","topic":"肿瘤免疫","topics":["肿瘤免疫"],"matchTerm":"tumor microenvironment","matchWhere":"摘要：tumor microenvironment","score":3,"authors":["Zilan Xu","Shuang Deng","Hongzhe Zhao","Daoyuan Wang","Qingchang Jin","Chunling Xue"],"authorMore":true,"abstract":"Nature Immunology, Published online: 09 November 2026; doi:10.1038/s41590-026-02708-y Solid tumor stiffness can limit the ability of immune cells to enter and kill tumor cells. Here the authors show that this stiffness activates YAP signaling in type 1 helper T cells, making them dysfunctional and thereby leading to a more immunosuppressive tumor microenvironment.","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-10","tkey":"other","id":150},{"title":"Encapsulated mitochondrial transplantation: Advancing organelle therapeutics","url":"https://doi.org/10.1038/s41392-026-02959-z","doi":"10.1038/s41392-026-02959-z","journal":"Signal Transduction and Targeted Therapy","jabbr":"Signal Transduction and Targeted Therapy","pubdate":"2026-10-25","topic":"cGAS-STING通路","topics":["cGAS-STING通路"],"matchTerm":"mitochondrial dna","matchWhere":"摘要：mitochondrial dna","score":3,"authors":["Hae-Jun Yang","Pil-Soo Jeong","Sun‐Uk Kim"],"authorMore":false,"abstract":"In a recent study published in Cell, Du and colleagues developed an erythrocyte membrane-based mitochondrial encapsulation platform that enables efficient transfer of functional mitochondria across cells and tissues, thereby overcoming a major delivery bottleneck in conventional mitochondrial transplantation. 1 Encapsulated mitochondria restored mitochondrial DNA (mtDNA) content and bioenergetic function, reduced pathogenic heteroplasmy in patient-derived mitochondrial disease models, and improved pathological phenotypes in mouse models of Leigh syndrome, mtDNA depletion syndrome, and Parkinson’s disease, highlighting the translational potential of engineered mitochondrial transplantation …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":151},{"title":"Accelerating scientific discovery with Co-Scientist","url":"https://doi.org/10.1038/s41586-026-10644-y","doi":"10.1038/s41586-026-10644-y","journal":"Nature","jabbr":"Nature","pubdate":"2026-05-19","topic":"药物联合","topics":["药物联合"],"matchTerm":"combination therapies","matchWhere":"摘要：combination therapies","score":3,"authors":["Juraj Gottweis","Wei‐Hung Weng","Alexander Daryin","Tao Tu","Petar Sirkovic","Anatoly Myaskovsky"],"authorMore":true,"abstract":"Abstract Scientific discovery is driven by scientists generating hypotheses for complex problems that undergo rigorous experimental validation. To augment this process, we introduce Co-Scientist, a multi-agent artificial intelligence (AI) system built on Gemini for structured scientific thinking and hypothesis generation. Co-Scientist aims to help scientists discover new original knowledge. Conditioned on their research objectives and previous scientific evidence, it formulates demonstrably novel research hypotheses for experimental verification. The system’s design involves agents continuously generating, critiquing and refining hypotheses accelerated by scaling test-time compute. Key contributions include (1) a multi-agent architecture with an asyn …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":152},{"title":"Nerve-to-cancer transfer of mitochondria during cancer metastasis","url":"https://doi.org/10.1038/s41586-025-09176-8","doi":"10.1038/s41586-025-09176-8","journal":"Nature","jabbr":"Nature","pubdate":"2025-06-25","topic":"药物联合","topics":["药物联合"],"matchTerm":"coculture","matchWhere":"摘要：coculture","score":3,"authors":["Gregory Hoover","Shila Gilbert","Olivia Curley","Clémence Obellianne","Mike T. Lin","William Hixson"],"authorMore":true,"abstract":"Abstract The nervous system has a pivotal role in cancer biology, and pathological investigations have linked intratumoural nerve density to metastasis1. However, the precise impact of cancer-associated neurons and the communication channels at the nerve–cancer interface remain poorly understood. Previous cancer denervation models in rodents and humans have highlighted robust cancer dependency on nerves, but the underlying mechanisms that drive nerve-mediated cancer aggressivity remain unknown2,3. Here we show that cancer-associated neurons enhance cancer metabolic plasticity by transferring mitochondria to cancer cells. Breast cancer denervation and nerve–cancer coculture models confirmed that neurons significantly improve tumour energetics. Neurons …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":153},{"title":"Activation of lysosomal iron triggers ferroptosis in cancer","url":"https://doi.org/10.1038/s41586-025-08974-4","doi":"10.1038/s41586-025-08974-4","journal":"Nature","jabbr":"Nature","pubdate":"2025-05-07","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"drug resistance","matchWhere":"摘要：drug resistance","score":3,"authors":["Tatiana Cañeque","Leeroy Baron","Sebastian Müller","Alanis Carmona","Ludovic Colombeau","Antoine Versini"],"authorMore":true,"abstract":"Abstract Iron catalyses the oxidation of lipids in biological membranes and promotes a form of cell death referred to as ferroptosis 1-3. Identifying where this chemistry takes place in the cell can inform the design of drugs capable of inducing or inhibiting ferroptosis in various disease-relevant settings. Whereas genetic approaches have revealed underlying mechanisms of lipid peroxide detoxification 1,4,5, small molecules can provide unparalleled spatiotemporal control of the chemistry at work 6. Here, we show that the ferroptosis inhibitor liproxstatin-1 (Lip-1) exerts a protective activity by inactivating iron in lysosomes. Based on this, we designed the bifunctional compound fentomycin that targets phospholipids at the plasma membrane and ac …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":154},{"title":"GABAergic neuron-to-glioma synapses in diffuse midline gliomas","url":"https://doi.org/10.1038/s41586-024-08579-3","doi":"10.1038/s41586-024-08579-3","journal":"Nature","jabbr":"Nature","pubdate":"2025-02-19","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"xenograft","matchWhere":"摘要：xenograft","score":3,"authors":["Tara Barron","Belgin Yalçın","Minhui Su","Youkyeong Gloria Byun","Avishai Gavish","Kiarash Shamardani"],"authorMore":true,"abstract":"Abstract High-grade gliomas (HGGs) are the leading cause of brain cancer-related death. HGGs include clinically, anatomically and molecularly distinct subtypes that stratify into diffuse midline gliomas (DMGs), such as H3K27M -altered diffuse intrinsic pontine glioma, and hemispheric HGGs, such as IDH wild-type glioblastoma. Neuronal activity drives glioma progression through paracrine signalling 1,2 and neuron-to-glioma synapses 3–6. Glutamatergic AMPA receptor-dependent synapses between neurons and glioma cells have been demonstrated in paediatric 3 and adult 4 high-grade gliomas, and early work has suggested heterogeneous glioma GABAergic responses 7. However, neuron-to-glioma synapses mediated by neurotransmitters other than glutamate remain un …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":155},{"title":"Characterizing and targeting glioblastoma neuron-tumor networks with retrograde tracing","url":"https://doi.org/10.1016/j.cell.2024.11.002","doi":"10.1016/j.cell.2024.11.002","journal":"Cell","jabbr":"Cell","pubdate":"2024-12-06","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"radiotherapy","matchWhere":"摘要：radiotherapy","score":3,"authors":["Svenja Kristin Tetzlaff","Ekin Reyhan","Nikolas Layer","C. Peter Bengtson","Alina Heuer","Julian Schroers"],"authorMore":true,"abstract":"Abstract Glioblastomas are invasive brain tumors with high therapeutic resistance. Neuron-to-glioma synapses have been shown to promote glioblastoma progression. However, a characterization of tumor-connected neurons has been hampered by a lack of technologies. Here, we adapted retrograde tracing using rabies viruses to investigate and manipulate neuron-tumor networks. Glioblastoma rapidly integrated into neural circuits across the brain, engaging in widespread functional communication, with cholinergic neurons driving glioblastoma invasion. We uncovered patient-specific and tumor-cell-state-dependent differences in synaptogenic gene expression associated with neuron-tumor connectivity and subsequent invasiveness. Importantly, radiotherapy enhanced n …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":156},{"title":"Prognostic genome and transcriptome signatures in colorectal cancers","url":"https://doi.org/10.1038/s41586-024-07769-3","doi":"10.1038/s41586-024-07769-3","journal":"Nature","jabbr":"Nature","pubdate":"2024-08-07","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"egfr","matchWhere":"摘要：egfr","score":3,"authors":["Luís Nunes","Fuqiang Li","Meizhen Wu","Tian Luo","Klara Hammarström","Emma Torell"],"authorMore":true,"abstract":"Abstract. Here, to understand the functional and prognostic impact of cancer-causing somatic mutations, we analysed the whole genomes and transcriptomes of 1,063 primary colorectal cancers in a population-based cohort with long-term follow-up. From the 96 mutated driver genes, 9 were not previously implicated in colorectal cancer and 24 had not been linked to any cancer. Two distinct patterns of pathway co-mutations were observed, timing analyses identified nine early and three late driver gene mutations, and several signatures of colorectal-cancer-specific mutational processes were identified. Mutations in WNT, EGFR and TGFβ pathway genes, the mitochondrial CYB gene and 3 regulatory elements along with 21 copy-number variations and the COSMIC SBS44 …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":157},{"title":"Oral Estrogen Receptor PROTAC Vepdegestrant (ARV-471) Is Highly Efficacious as Monotherapy and in Combination with CDK4/6 or PI3K/mTOR Pathway Inhibitors in Preclinical ER+ Breast Cancer Models","url":"https://doi.org/10.1158/1078-0432.ccr-23-3465","doi":"10.1158/1078-0432.ccr-23-3465","journal":"Clinical Cancer Research","jabbr":"Clinical Cancer Research","pubdate":"2024-05-31","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"her2","matchWhere":"摘要：her2","score":3,"authors":["Sheryl M. Gough","John J. Flanagan","Jessica L.F. Teh","Monica Andreoli","Emma Rousseau","Melissa Pannone"],"authorMore":true,"abstract":"Abstract PURPOSE: Estrogen receptor (ER) alpha signaling is a known driver of ER-positive (ER+)/human epidermal growth factor receptor 2 negative (HER2-) breast cancer. Combining endocrine therapy (ET) such as fulvestrant with CDK4/6, mTOR, or PI3K inhibitors has become a central strategy in the treatment of ER+ advanced breast cancer. However, suboptimal ER inhibition and resistance resulting from the ESR1 mutation dictates that new therapies are needed. EXPERIMENTAL DESIGN: A medicinal chemistry campaign identified vepdegestrant (ARV-471), a selective, orally bioavailable, and potent small molecule PROteolysis-TArgeting Chimera (PROTAC) degrader of ER. We used biochemical and intracellular target engagement assays to demonstrate the mechanism of ac …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":158},{"title":"The intrinsic substrate specificity of the human tyrosine kinome","url":"https://doi.org/10.1038/s41586-024-07407-y","doi":"10.1038/s41586-024-07407-y","journal":"Nature","jabbr":"Nature","pubdate":"2024-05-08","topic":"药物联合","topics":["药物联合"],"matchTerm":"combinatorial","matchWhere":"摘要：combinatorial","score":3,"authors":["Tomer M. Yaron","Brian A. Joughin","Emily M. Huntsman","Alexander Kerelsky","Daniel M. Cizin","Benjamin M. Cohen"],"authorMore":true,"abstract":"Abstract Phosphorylation of proteins on tyrosine (Tyr) residues evolved in metazoan organisms as a mechanism of coordinating tissue growth1. Multicellular eukaryotes typically have more than 50 distinct protein Tyr kinases that catalyse the phosphorylation of thousands of Tyr residues throughout the proteome1–3. How a given Tyr kinase can phosphorylate a specific subset of proteins at unique Tyr sites is only partially understood4–7. Here we used combinatorial peptide arrays to profile the substrate sequence specificity of all human Tyr kinases. Globally, the Tyr kinases demonstrate considerable diversity in optimal patterns of residues surrounding the site of phosphorylation, revealing the functional organization of the human Tyr kinome by substrate …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":159},{"title":"Translational and Therapeutic Evaluation of RAS-GTP Inhibition by RMC-6236 in RAS-Driven Cancers","url":"https://doi.org/10.1158/2159-8290.cd-24-0027","doi":"10.1158/2159-8290.cd-24-0027","journal":"Cancer Discovery","jabbr":"Cancer Discovery","pubdate":"2024-04-09","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"xenograft","matchWhere":"摘要：xenograft","score":3,"authors":["Jingjing Jiang","Lingyan Jiang","Benjamin J. Maldonato","Yingyun Wang","Matthew T. Holderfield","Ida Aronchik"],"authorMore":true,"abstract":"Abstract RAS-driven cancers comprise up to 30% of human cancers. RMC-6236 is a RAS(ON) multi-selective noncovalent inhibitor of the active, GTP-bound state of both mutant and wild-type variants of canonical RAS isoforms with broad therapeutic potential for the aforementioned unmet medical need. RMC-6236 exhibited potent anticancer activity across RAS-addicted cell lines, particularly those harboring mutations at codon 12 of KRAS. Notably, oral administration of RMC-6236 was tolerated in vivo and drove profound tumor regressions across multiple tumor types in a mouse clinical trial with KRASG12X xenograft models. Translational PK/efficacy and PK/PD modeling predicted that daily doses of 100 mg and 300 mg would achieve tumor control and objective respo …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":160},{"title":"Concurrent inhibition of oncogenic and wild-type RAS-GTP for cancer therapy","url":"https://doi.org/10.1038/s41586-024-07205-6","doi":"10.1038/s41586-024-07205-6","journal":"Nature","jabbr":"Nature","pubdate":"2024-04-08","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"small molecule inhibitors","matchWhere":"摘要：small molecule inhibitors","score":3,"authors":["Matthew T. Holderfield","Bianca J. Lee","Jingjing Jiang","Aidan C.A. Tomlinson","Kyle J. Seamon","Alessia Mira"],"authorMore":true,"abstract":"Abstract RAS oncogenes (collectively NRAS, HRAS and especially KRAS) are among the most frequently mutated genes in cancer, with common driver mutations occurring at codons 12, 13 and 61 1. Small molecule inhibitors of the KRAS(G12C) oncoprotein have demonstrated clinical efficacy in patients with multiple cancer types and have led to regulatory approvals for the treatment of non-small cell lung cancer 2,3. Nevertheless, KRAS G12C mutations account for only around 15% of KRAS -mutated cancers 4,5, and there are no approved KRAS inhibitors for the majority of patients with tumours containing other common KRAS mutations. Here we describe RMC-7977, a reversible, tri-complex RAS inhibitor with broad-spectrum activity for the active state of both mut …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":161},{"title":"Tumour-selective activity of RAS-GTP inhibition in pancreatic cancer","url":"https://doi.org/10.1038/s41586-024-07379-z","doi":"10.1038/s41586-024-07379-z","journal":"Nature","jabbr":"Nature","pubdate":"2024-04-08","topic":"药物联合","topics":["药物联合"],"matchTerm":"combinatorial","matchWhere":"摘要：combinatorial","score":3,"authors":["Urszula N. Wasko","Jingjing Jiang","Tanner C. Dalton","Álvaro Curiel‐García","A. Cole Edwards","Yingyun Wang"],"authorMore":true,"abstract":"Abstract Broad-spectrum RAS inhibition has the potential to benefit roughly a quarter of human patients with cancer whose tumours are driven by RAS mutations 1,2. RMC-7977 is a highly selective inhibitor of the active GTP-bound forms of KRAS, HRAS and NRAS, with affinity for both mutant and wild-type variants 3. More than 90% of cases of human pancreatic ductal adenocarcinoma (PDAC) are driven by activating mutations in KRAS 4. Here we assessed the therapeutic potential of RMC-7977 in a comprehensive range of PDAC models. We observed broad and pronounced anti-tumour activity across models following direct RAS inhibition at exposures that were well-tolerated in vivo. Pharmacological analyses revealed divergent responses to RMC-7977 in tumour versus …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":162},{"title":"Efficacy and Safety of Adagrasib plus Cetuximab in Patients with KRAS G12C-Mutated Metastatic Colorectal Cancer","url":"https://doi.org/10.1158/2159-8290.cd-24-0217","doi":"10.1158/2159-8290.cd-24-0217","journal":"Cancer Discovery","jabbr":"Cancer Discovery","pubdate":"2024-04-08","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"egfr","matchWhere":"摘要：egfr","score":3,"authors":["Rona D. Yaeger","Nataliya Volodymyrivna Uboha","Meredith S. Pelster","Tanios Bekaii‐Saab","Minal A. Barve","Joel N. Saltzman"],"authorMore":true,"abstract":"Abstract Adagrasib, an irreversible, selective KRASG12C inhibitor, may be an effective treatment in KRASG12C-mutated colorectal cancer, particularly when combined with an anti-EGFR antibody. In this analysis of the KRYSTAL-1 trial, patients with previously treated KRASG12C-mutated unresectable or metastatic colorectal cancer received adagrasib (600 mg twice daily) plus cetuximab. The primary endpoint was objective response rate (ORR) by blinded independent central review. Ninety-four patients received adagrasib plus cetuximab. With a median follow-up of 11.9 months, ORR was 34.0%, disease control rate was 85.1%, and median duration of response was 5.8 months (95% confidence interval [CI], 4.2-7.6). Median progression-free survival was 6.9 months (95% …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":163},{"title":"Adeno-to-squamous transition drives resistance to KRAS inhibition in LKB1 mutant lung cancer","url":"https://doi.org/10.1016/j.ccell.2024.01.012","doi":"10.1016/j.ccell.2024.01.012","journal":"Cancer Cell","jabbr":"Cancer Cell","pubdate":"2024-02-22","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"targeted therapies","matchWhere":"摘要：targeted therapies","score":3,"authors":["Xinyuan Tong","Ayushi S. Patel","Eejung Kim","Hongjun Li","Yueqing Chen","Shuai Li"],"authorMore":true,"abstract":"Abstract KRASG12C inhibitors (adagrasib and sotorasib) have shown clinical promise in targeting KRASG12C-mutated lung cancers; however, most patients eventually develop resistance. In lung patients with adenocarcinoma with KRASG12C and STK11/LKB1 co-mutations, we find an enrichment of the squamous cell carcinoma gene signature in pre-treatment biopsies correlates with a poor response to adagrasib. Studies of Lkb1-deficient KRASG12C and KrasG12D lung cancer mouse models and organoids treated with KRAS inhibitors reveal tumors invoke a lineage plasticity program, adeno-to-squamous transition (AST), that enables resistance to KRAS inhibition. Transcriptomic and epigenomic analyses reveal ΔNp63 drives AST and modulates response to KRAS inhibition. We ide …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":164},{"title":"Characterization and heterologous reconstitution of Taxus biosynthetic enzymes leading to baccatin III","url":"https://doi.org/10.1126/science.adj3484","doi":"10.1126/science.adj3484","journal":"Science","jabbr":"Science","pubdate":"2024-01-25","topic":"抗肿瘤药物","topics":["抗肿瘤药物"],"matchTerm":"taxane","matchWhere":"摘要：taxane","score":3,"authors":["Bin Jiang","Lei Gao","Haijun Wang","Ya‐Ping Sun","Xiaolin Zhang","Ke Han"],"authorMore":true,"abstract":"Abstract Paclitaxel is a well known anticancer compound. Its biosynthesis involves the formation of a highly functionalized diterpenoid core skeleton (baccatin III) and the subsequent assembly of a phenylisoserinoyl side chain. Despite intensive investigation for half a century, the complete biosynthetic pathway of baccatin III remains unknown. In this work, we identified a bifunctional cytochrome P450 enzyme [taxane oxetanase 1 (TOT1)] in Taxus mairei that catalyzes an oxidative rearrangement in paclitaxel oxetane formation, which represents a previously unknown enzyme mechanism for oxetane ring formation. We created a screening strategy based on the taxusin biosynthesis pathway and uncovered the enzyme responsible for the taxane oxidation of the C9 …  …","tier":"other","tierLabel":"其他相关","reportDate":"2023-2026三年回溯","tkey":"other","id":168}],"reports":[{"date":"2026-11-11","generated":"2026-11-11 10:53","count":8},{"date":"2026-11-10","generated":"2026-11-10 12:42","count":14},{"date":"2026-11-09","generated":"2026-11-09 11:48","count":2},{"date":"2026-11-08","generated":"2026-11-08 10:36","count":0},{"date":"2026-11-07","generated":"2026-11-07 11:13","count":22},{"date":"2023-2026三年回溯","generated":"2026-11-09 11:42","count":123}],"topics":["DNA损伤修复","肿瘤免疫","抗肿瘤药物","药物联合","cGAS-STING通路"],"themeKeys":["air","rs","chem","bgc","ghg","wx","gis"],"topicTheme":{"空气污染":"air","遥感":"rs","大气化学":"chem","生物地球化学":"bgc","温室气体":"ghg","极端天气":"wx","城市地理信息系统":"gis"},"generated":"2026-11-11 10:53"}</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('DATA').textContent);
  var A = D.articles;
  var TOPICS = D.topics;

  /* Inline SVG rather than emoji: emoji depend on a colour-emoji font being
     installed, and the missing-glyph box is worse than no icon at all. */
  var P = {
    all:   '<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
    air:   '<path d="M3 7.5h9.6a2.6 2.6 0 1 0-2.6-2.6"/><path d="M3 12h13.2a2.6 2.6 0 1 1-2.6 2.6"/><path d="M3 16.5h6.8"/>',
    rs:    '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.7" ry="8.6"/><path d="M3.4 12h17.2"/>',
    chem:  '<path d="M9.5 2.8h5"/><path d="M10.6 2.8v5.8L6.3 16.9a2 2 0 0 0 1.8 3h7.8a2 2 0 0 0 1.8-3L15.4 8.6V2.8"/><path d="M7.9 13.6h8.2"/>',
    bgc:   '<path d="M20.6 3.4C20.6 12 15.7 16.1 9.5 16.1H4.1C4.1 7.5 9 3.4 15.2 3.4h5.4z"/><path d="M4.1 20.6c2.2-5.8 6.1-9.1 11.3-10.5"/>',
    ghg:   '<path d="M4.6 20v-6.2"/><path d="M2.2 15.6 4.6 13.2l2.4 2.4"/><path d="M12 20V9.4"/><path d="M9.6 11.8 12 9.4l2.4 2.4"/><path d="M19.4 20v-3.4"/><path d="M17 18.4l2.4-2.4 2.4 2.4"/>',
    wx:    '<path d="M13.2 2.6 4.4 13.8h6.2l-1 7.6 8.8-11.2h-6.2l1-7.6z"/>',
    gis:   '<path d="M9 3.4 3.5 5.8v14.8L9 18.2l6 2.4 5.5-2.4V3.4L15 5.8 9 3.4z"/><path d="M9 3.4v14.8"/><path d="M15 5.8v14.8"/>',
    other: '<path d="M14 3H7.6A2 2 0 0 0 5.6 5v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7.6L14 3z"/><path d="M14 3v4.6h4.6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-4.3-4.3"/>'
  };
  function svg(k, cls){
    return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[k]||P.other)+'</svg>';
  }

  var state = { topic:'all', tier:'all', sort:'score', q:'' };

  /* An article can hit several keyword groups at once. a.topics holds every
     match (used for filtering); a.topic is the primary one (used for the cover
     chip and the section grouping, so nothing is listed twice). */
  var THEME = D.topicTheme || {};
  function topicsOf(a){ return a.topics && a.topics.length ? a.topics : [a.topic]; }

  var tabs = document.getElementById('tabs');
  var C = {all:A.length};
  TOPICS.forEach(function(t){ C[t]=0; });
  A.forEach(function(a){
    topicsOf(a).forEach(function(t){ if(C[t]!==undefined) C[t]++; });
  });

  var tabDefs = [{k:'all',label:'全部',icon:'all'}].concat(
    TOPICS.map(function(t){ return {k:t,label:t,icon:THEME[t]||'other'}; })
  );
  tabDefs.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'tab' + (d.k==='all'?' on':'');
    b.type = 'button';
    var n = d.k==='all' ? C.all : (C[d.k]||0);
    b.innerHTML = svg(d.icon) + '<span>'+d.label+'</span><span class="n">'+n+'</span>';
    b.onclick = function(){
      state.topic = d.k;
      [].forEach.call(tabs.children, function(x){ x.classList.toggle('on', x===b); });
      render();
    };
    tabs.appendChild(b);
  });

  document.getElementById('seg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.tier = b.dataset.t;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  document.getElementById('sortseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.sort = b.dataset.s;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  var qt;
  document.getElementById('q').oninput = function(e){
    clearTimeout(qt);
    var v = e.target.value.trim().toLowerCase();
    qt = setTimeout(function(){ state.q = v; render(); }, 130);
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
  function initial(name){
    if(!name) return '?';
    var m = /[A-Za-z]/.exec(name);
    return m ? m[0].toUpperCase() : name.slice(0,1);
  }
  function isFuture(d){ return (d||'').indexOf('（在线预发表）') >= 0; }
  function dateOf(a){ return (a.pubdate||a.reportDate||'').replace('（在线预发表）','').slice(0,10); }
  document.getElementById('kpi-days').textContent = D.reports.length;

  function select(){
    var q = state.q;
    var out = A.filter(function(a){
      if(state.topic!=='all' && topicsOf(a).indexOf(state.topic)<0) return false;
      if(state.tier!=='all' && a.tier!==state.tier) return false;
      if(q){
        var hay = (a.title+' '+a.abstract+' '+a.authors.join(' ')+' '+a.journal+' '+a.doi).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='date'){
      out.sort(function(x,y){ return dateOf(y).localeCompare(dateOf(x)) || ((y.score||0)-(x.score||0)); });
    } else if(state.sort==='journal'){
      out.sort(function(x,y){ return x.journal.localeCompare(y.journal) || ((y.score||0)-(x.score||0)); });
    } else {
      out.sort(function(x,y){ return ((y.score||0)-(x.score||0)) || dateOf(y).localeCompare(dateOf(x)); });
    }
    return out;
  }

  function cardHTML(a){
    var tags = '<span class="tag '+a.tier+'">'+esc(a.tierLabel)+'</span>'
             + '<span class="tag">'+esc(a.jabbr)+'</span>';
    if(a.score!=null) tags += '<span class="tag">得分 '+a.score+'</span>';
    if(a.matchTerm) tags += '<span class="tag match" title="命中位置：'+esc(a.matchWhere)+'">命中 '+esc(a.matchTerm)+'</span>';
    topicsOf(a).filter(function(t){ return t!==a.topic; }).slice(0,2).forEach(function(t){
      tags += '<span class="tag cross">也属 '+esc(t)+'</span>';
    });

    var ab = a.abstract
      ? '<p class="excerpt">'+esc(trunc(a.abstract,200))+'</p>'
      : '<p class="excerpt none">日报未收录摘要'+(a.matchTerm?'（命中词 '+esc(a.matchTerm)+'）':'')+' · 点击看原文</p>';

    var au = esc(a.authors[0] || '佚名') + (a.authors.length>1 ? ' 等 '+(a.authors.length-1)+' 位' : '');

    return '<article class="card t-'+a.tkey+'" data-id="'+a.id+'" tabindex="0">'
      + '<div class="cover">'
      +   '<div class="tp">'+esc(a.topic)+'</div>'
      +   (a.score!=null ? '<div class="sc">★ '+a.score+'</div>' : '')
      +   '<div class="icon">'+svg(a.tkey)+'</div>'
      +   '<div class="jr">'+esc(a.jabbr)+'</div>'
      +   '<div class="tier '+a.tier+'"></div>'
      + '</div>'
      + '<div class="body">'
      +   '<h3 class="title">'+esc(a.title)+'</h3>'
      +   ab
      +   '<div class="tagrow">'+tags+'</div>'
      + '</div>'
      + '<div class="foot">'
      +   '<div class="av">'+esc(initial(a.authors[0]))+'</div>'
      +   '<div class="au">'+au+'</div>'
      +   '<div class="dt">'+esc(dateOf(a))+(isFuture(a.pubdate)?' · 预发表':'')+'</div>'
      + '</div>'
      + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');
  var TIER_NAME = {must_read:'必读', worth_reading:'值得一读', other:'其他相关'};

  function render(){
    var list = select();
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+esc(a.title)+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="sec-t">摘要</div>'
      +   (a.abstract
            ? '<p class="abs">'+esc(a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">该条日报未收录摘要。</p>')
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
</body>
</html>
